name: codex

# Keeps the profile panels in step with what is actually public. A repo that is
# deleted or flipped to private drops out of the public listing, so the same
# pass handles removals and additions.
on:
  schedule:
    - cron: '17 4 * * *'      # daily, 04:17 UTC
  workflow_dispatch:           # and on demand
  push:
    branches: [main]
    paths:
      - 'codex/**'
      - '.github/workflows/codex.yml'

permissions:
  contents: write

concurrency:
  group: codex
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # stale.py dates a card from the history of codex.json. At the
          # default depth of 1 there is no history and every card looks as
          # though it was written at the only commit present.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow

      - name: Reconcile codex.json with public repos
        working-directory: codex
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 sync.py

      - name: Refresh the contribution calendar
        # Scraped from public HTML, so no PAT. activity.py aborts without
        # writing if the markup stops matching what the panel expects, and this
        # step does not fail the run: a stale calendar is fine, the rest of the
        # job is not about it.
        continue-on-error: true
        working-directory: codex
        run: python3 activity.py

      - name: Regenerate panels and README
        working-directory: codex
        run: |
          python3 gen.py
          python3 readme.py

      - name: Rebuild the animation
        working-directory: codex
        run: python3 animate.py

      - name: Flag cards the repo has outrun
        # Reports only. A card going stale is a prompt to re-read prose, not a
        # build failure, and failing the daily job would just train us to ignore
        # it. The findings go to the run summary and to warning annotations.
        continue-on-error: true
        working-directory: codex
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(python3 stale.py) || true
          printf '%s\n' "$out"
          {
            echo '## Cards the repo has outrun'
            echo
            echo '```'
            printf '%s\n' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$out" | sed -n \
            's/^  \(No\.[0-9]*\)  \([^ ]*\).*repo moved \([0-9]*\)d later.*/::warning title=Card may be stale::\1 \2 — repo moved \3d after the card was written/p'

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed"; exit 0
          fi
          git config user.name  "Dheirav"
          git config user.email "dheirav2005@gmail.com"
          # The calendar moves every day whether or not anything else did, so it
          # would otherwise file a daily "sync with public repos" that is not
          # true. Name the commit after what actually changed, and the log stays
          # filterable: git log --invert-grep --grep='activity panel'
          if [ -z "$(git status --porcelain | grep -v 'codex/activity')" ]; then
            msg="codex: refresh the activity panel"
          else
            msg="codex: sync with public repos"
          fi
          git add -A
          git commit -m "$msg"
          git push
